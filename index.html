<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Sign Up Form</title>
 <link rel="stylesheet" href="styles.css">
</head>
<body>
 <div class="container">
  <!-- first colum container -->
   <div class="hero">
      <!-- logo -->
      <div class="hero-logo">
         <img src="images/logo_JBG.svg" alt="jonibygood">
      </div>
      <!-- img credits -->
      <div class="credits">
         Photo by <a href="https://unsplash.com/@inakihxz?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Iñaki del Olmo</a> on <a href="https://unsplash.com/photos/low-angle-photography-of-high-rise-building-I9RsLzpoEG4?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
      
      </div>
   </div>


   <!-- second column container -->
    <div class="wrapper">
     <!-- legend -->
     <div class="wrapper-legend">
      <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest drems.
      <span>Sign up <i>now</i> to get started</p></span> 
      
      <p>You <i>know</i> you want to.</p>
     </div>
    </div>

    <!-- form -->
     <div class="wrapper-form">
      <h1>Let's do this!</h1>
      <form id="registrationForm" action="#" method="post">
       <!-- form field -->
       <div class="form-item">
        <label for="name">first name</label>
        <input type="text" id="name" name="name">
       </div>
       <!-- form field -->
        <div class="form-item">
         <label for="lastName">last name</label>
         <input type="text" id="lastName" name="lastName">
        </div>
        <!-- form field -->
         <div class="form-item">
          <label for="email">email</label>
          <input type="email" id="email" name="email">
         </div>
         <!-- form field -->
          <div class="form-item">
           <label for="#numeber">phone number</label>
           <input type="number" id="#number" name="#number">
          </div>
          <!-- form field -->
           <div class="form-item">
            <label for="password">password</label>
            <input type="password" id="password" name="password">
           </div>
          <!-- form field -->
           <div class="form-item">
            <label for="password-2">confirm password</label>
            <input type="password" id="password-2" name="password">
           </div>
      </form>
     </div>

     <div class="footer">
      <button type="submit" form="registrationForm">create account</button>
      <p>Already have an account? <a href="#">Log in</a></p>
     </div>
  
 </div>
 
</body>
</html>
